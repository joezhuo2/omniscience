name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A main run builds the installers a release tag reuses; never cancel it halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pushes to main build signed installers; a release tag on that commit reuses them.
  INSTALLERS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Typechecks and produces dist/, which tauri::generate_context! needs at compile time.
      - run: npm run build

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npm run tauri build -- --no-bundle
        if: env.INSTALLERS != 'true'

      # Same build as release.yml's tauri-action step.
      - name: Build installers
        if: env.INSTALLERS == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }} --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        if: env.INSTALLERS == 'true'
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi*
            src-tauri/target/release/bundle/nsis/*.exe*
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
          retention-days: 30
